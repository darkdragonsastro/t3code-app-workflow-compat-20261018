name: Create synthetic cross-fork PR
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create only the synthetic fixture PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/darkdragonsastro/t3code-app-workflow-compat-20261018/pulls \
            --field title='Synthetic cross-fork approval fixture' \
            --field body='Trivial public fixture only; no project data or secrets.' \
            --field base=main \
            --field maintainer_can_modify=false \
            --field head='rickbassham:approval-fixture' \
            --field head_repo='t3code-app-workflow-compat-fork-20261018' \
            --jq .number
